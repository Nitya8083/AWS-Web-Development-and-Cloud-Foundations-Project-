<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q.8 - CSS Selectors and Background Images</title>
    <link rel="stylesheet" href="style7.css">
</head>
<body>

    <div class="main-card">
        <!-- Main Heading using an ID selector -->
        <h1 id="main-title">CSS Styling Demonstration</h1>
        
        <!-- Paragraphs using class selectors -->
        <p class="font-serif">This paragraph uses a serif font family with a classic style.</p>
        <p class="font-sans">This paragraph uses a sans-serif font family with a clean, modern look.</p>
        <p class="font-mono">This paragraph uses a monospace font family like code text.</p>

        <!-- Element with its own background image -->
        <div class="element-bg">
            <p>This single element has its own background image and specific style.</p>
        </div>
    </div>

</body>
</html>
