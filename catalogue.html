<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

</head>
<body>

    <header class="header">
        <div class="logo-area">
            <h2>KIET Bookstore</h2>
            <span>Book Inventory</span>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Login</a>

            <div class="card">
                <h3>Data Structures</h3>
                <p>Price: ₹550</p>
                <a href="cart.html" class="btn" style="display:block; text-align:center; text-decoration:none; padding:6px;">Add to Cart</a>
            </div>
            <div class="card">
                <h3>Web Technologies</h3>
                <p>Price: ₹400</p>
                <a href="cart.html" class="btn" style="display:block; text-align:center; text-decoration:none; padding:6px;">Add to Cart</a>
            </div>
        </div>
    </div>

</html>
