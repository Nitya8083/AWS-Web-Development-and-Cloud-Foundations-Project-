<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Lists</title>
    <link rel="stylesheet" href="style6.css">
</head>
<body>

    <div class="card">
        <h1>HTML Lists Demo</h1>

        <!-- a. Ordered List -->
        <h3>a. Ordered List</h3>
        <ol>
            <li>First item</li>
            <li>Second item</li>
            <li>Third item</li>
        </ol>

        <!-- b. Unordered List -->
        <h3>b. Unordered List</h3>
        <ul>
            <li>Apple</li>
            <li>Banana</li>
            <li>Cherry</li>
        </ul>

        <!-- c. Description List -->
        <h3>c. Description List</h3>
        <dl>
            <dt>HTML</dt>
            <dd>Structure of web pages</dd>
            <dt>CSS</dt>
            <dd>Styling of web pages</dd>
        </dl>
    </div>

</body>
</html>
